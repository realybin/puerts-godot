name: Build GDExtension

on:
  workflow_dispatch:
    inputs:
      build_windows_x86_64: { description: "windows/x86_64", type: boolean, required: false, default: false }
      build_macos_arm64: { description: "macos/arm64", type: boolean, required: false, default: false }
      build_linux_x86_64: { description: "linux/x86_64", type: boolean, required: false, default: false }
      build_android_arm64: { description: "android/arm64", type: boolean, required: false, default: false }
      build_ios_arm64: { description: "ios/arm64", type: boolean, required: false, default: false }
      build_web_wasm32: { description: "web/wasm32", type: boolean, required: false, default: false }
      web_threads: { description: "Web thread support", type: boolean, required: false, default: true }
      build_godot_4_5: { description: "Godot 4.5", type: boolean, required: false, default: false }
      build_godot_4_6: { description: "Godot 4.6", type: boolean, required: false, default: false }
      build_godot_4_7: { description: "Godot 4.7", type: boolean, required: false, default: true }
      target_type:
        description: "Build target type"
        type: choice
        required: true
        default: template_debug
        options:
          - template_debug
          - template_release
      float_precision:
        description: "Build float precision"
        type: choice
        required: true
        default: single
        options:
          - single
          - double
      restore_cache: { description: "Restore build cache", type: boolean, required: false, default: true }
      save_cache: { description: "Save build cache", type: boolean, required: false, default: false }

jobs:
  prepare:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      godot_versions: ${{ steps.select.outputs.godot_versions }}
    steps:
      - id: select
        shell: bash
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          add_target() {
            if [[ $(jq -r ".build_$1" <<<"$INPUTS") == true ]]; then
              targets=$(jq -c ". + [{platform:\"$2\",arch:\"$3\",os:\"$4\"}]" <<<"$targets")
            fi
          }
          add_godot() {
            if [[ $(jq -r ".build_godot_${1//./_}" <<<"$INPUTS") == true ]]; then
              godot_versions=$(jq -c ". + [{api_version:\"$1\",godot_version:\"$2\"}]" <<<"$godot_versions")
            fi
          }

          targets='[]'
          add_target windows_x86_64 windows x86_64 windows-2022
          add_target macos_arm64 macos arm64 macos-14
          add_target linux_x86_64 linux x86_64 ubuntu-22.04
          add_target android_arm64 android arm64 ubuntu-22.04
          add_target ios_arm64 ios arm64 macos-15
          add_target web_wasm32 web wasm32 ubuntu-22.04

          godot_versions='[]'
          add_godot 4.5 4.5.2
          add_godot 4.6 4.6.3
          add_godot 4.7 4.7.2

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "godot_versions=$godot_versions" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.platform }} ${{ matrix.target.arch }}${{ fromJSON(needs.prepare.outputs.godot_versions)[1] != null && format(' (Godot {0})', matrix.godot.api_version) || '' }}
    needs: prepare
    if: ${{ needs.prepare.outputs.targets != '[]' && needs.prepare.outputs.godot_versions != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
        godot: ${{ fromJSON(needs.prepare.outputs.godot_versions) }}

    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/actions/gdextension
        with:
          platform: ${{ matrix.target.platform }}
          arch: ${{ matrix.target.arch }}
          target_type: ${{ inputs.target_type }}
          float_precision: ${{ inputs.float_precision }}
          web_threads: ${{ inputs.web_threads }}
          api_version: ${{ matrix.godot.api_version }}
          godot_version: ${{ matrix.godot.godot_version }}
          run_tests: true
          upload_artifact: true
          restore_cache: ${{ inputs.restore_cache }}
          save_cache: ${{ inputs.save_cache && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          save_native_cache: ${{ matrix.godot.api_version == fromJSON(needs.prepare.outputs.godot_versions)[0].api_version }}

  publish:
    name: Publish packages${{ fromJSON(needs.prepare.outputs.godot_versions)[1] != null && format(' (Godot {0})', matrix.godot.api_version) || '' }}
    runs-on: ubuntu-22.04
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.targets != '[]' && needs.prepare.outputs.godot_versions != '[]' }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        godot: ${{ fromJSON(needs.prepare.outputs.godot_versions) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gdextension-build-godot${{ matrix.godot.api_version }}-${{ inputs.float_precision }}-*
          path: artifacts

      - name: Stage packages
        id: package
        run: |
          python misc/scripts/package_release.py --artifacts artifacts --output dist
          python - <<'PY'
          import os
          from pathlib import Path
          from misc.scripts.manifest import BACKENDS

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for component in BACKENDS:
                  for directory in Path("dist").glob(f"puerts-godot-{component}-v*"):
                      output.write(f"{component}={directory.name}\n")
          PY

      - name: Upload core
        if: ${{ steps.package.outputs.core != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.core }}
          path: dist/${{ steps.package.outputs.core }}/
          if-no-files-found: error
          overwrite: true

      - name: Upload v8
        if: ${{ steps.package.outputs.v8 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.v8 }}
          path: dist/${{ steps.package.outputs.v8 }}/
          if-no-files-found: error
          overwrite: true

      - name: Upload nodejs
        if: ${{ steps.package.outputs.nodejs != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.nodejs }}
          path: dist/${{ steps.package.outputs.nodejs }}/
          if-no-files-found: error
          overwrite: true

      - name: Upload quickjs
        if: ${{ steps.package.outputs.quickjs != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.quickjs }}
          path: dist/${{ steps.package.outputs.quickjs }}/
          if-no-files-found: error
          overwrite: true

      - name: Upload lua
        if: ${{ steps.package.outputs.lua != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.lua }}
          path: dist/${{ steps.package.outputs.lua }}/
          if-no-files-found: error
          overwrite: true

      - name: Upload web
        if: ${{ steps.package.outputs.web != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.web }}
          path: dist/${{ steps.package.outputs.web }}/
          if-no-files-found: error
          overwrite: true

      - name: Remove intermediate artifacts
        uses: actions/github-script@v8
        env:
          ARTIFACT_PREFIX: gdextension-build-godot${{ matrix.godot.api_version }}-${{ inputs.float_precision }}-
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name.startsWith(process.env.ARTIFACT_PREFIX)) {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                });
              }
            }
