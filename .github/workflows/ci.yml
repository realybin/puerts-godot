name: Continuous Integration

on:
  workflow_call:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup clang-format
        shell: bash
        run: |
          python -m pip install "clang-format==21.1.0"
          clang-format --version

      - name: Run clang-format
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            mapfile -t files < <(rg --files src -g '*.h' -g '*.hpp' -g '*.c' -g '*.cc' -g '*.cpp')
          else
            mapfile -t files < <(find src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \))
          fi
          ((${#files[@]})) || { echo "No C/C++ files found under src"; exit 0; }
          clang-format -style=file --dry-run --Werror "${files[@]}"

  build:
    name: Build ${{ matrix.target.platform }} ${{ matrix.target.arch }}${{ matrix.target.platform == 'web' && format(' ({0})', matrix.web_threads && 'threads' || 'nothreads') || '' }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
#          - target: { platform: windows, arch: x86_64, os: windows-2022 }
#            target_type: template_debug
#            float_precision: single
#          - target: { platform: macos, arch: arm64, os: macos-14 }
#            target_type: template_debug
#            float_precision: single
          - target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }
            target_type: template_debug
            float_precision: single
            web_threads: true
#          - target: { platform: web, arch: wasm32, os: ubuntu-22.04 }
#            target_type: template_debug
#            float_precision: single
#            web_threads: false
#          - target: { platform: web, arch: wasm32, os: ubuntu-22.04 }
#            target_type: template_debug
#            float_precision: single
#            web_threads: true
#          - target: { platform: android, arch: arm64, os: ubuntu-22.04 }
#            target_type: template_debug
#            float_precision: single
#          - target: { platform: ios, arch: arm64, os: macos-15 }
#            target_type: template_debug
#            float_precision: single
#          - target: { platform: web, arch: wasm32, os: ubuntu-22.04 }
#            target_type: template_release
#            float_precision: double

    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/actions/gdextension
        with:
          platform: ${{ matrix.target.platform }}
          arch: ${{ matrix.target.arch }}
          target_type: ${{ matrix.target_type }}
          float_precision: ${{ matrix.float_precision }}
          backends: ${{ matrix.target.platform == 'web' && 'core,web' || '' }}
          web_threads: ${{ matrix.web_threads || false }}
          run_tests: true
          upload_artifact: ${{ matrix.target.platform == 'web' }}
          restore_cache: true
          cache_scope: ci
          save_cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
