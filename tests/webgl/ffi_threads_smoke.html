<!doctype html>
<meta charset="utf-8">
<title>Puerts threaded FFI smoke</title>
<script src="smoke.js"></script>
<script>
window.ffiResult = { status: "running", messages: [] };
const message = text => {
  window.ffiResult.messages.push(String(text));
  console.log(text);
};
(async () => {
  if (!crossOriginIsolated) throw new Error("The shared-memory smoke page must be cross-origin isolated");
  const memory = new WebAssembly.Memory({ initial: 256, maximum: 32768, shared: true });
  const module = await createPuertsFfiSmoke({
    wasmMemory: memory,
    print: message,
    printErr: text => { message(text); },
    locateFile(path) {
      return path.includes("Puerts") ? "../../bin/" + path.split(/[\\/]/).pop() : path;
    }
  });
  if (!window.ffiResult.messages.includes("[webgl-ffi] PASS")) throw new Error("The production shared-memory FFI smoke did not pass");
  const previousBuffer = memory.buffer;
  const previousHeap = module.HEAPU8;
  const workerSource = `onmessage = ({ data: memory }) => {
    const pointer = memory.buffer.byteLength;
    memory.grow(1);
    const bytes = new TextEncoder().encode("grown-\\u0000你好😀-tail");
    new Uint8Array(memory.buffer, pointer, bytes.length).set(bytes);
    new Uint16Array(memory.buffer, pointer + 64, 16).set([103,114,111,119,110,45,0,0x4f60,0x597d,0xd83d,0xde00,45,116,97,105,108]);
    new Uint8Array(memory.buffer, pointer + 128, 6).set([0,1,128,255,7,9]);
    postMessage({ pointer, length: bytes.length, after: memory.buffer.byteLength });
  };`;
  const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: "text/javascript" }));
  const worker = new Worker(workerUrl);
  const payload = await new Promise((resolve, reject) => {
    worker.onmessage = event => resolve(event.data);
    worker.onerror = reject;
    worker.postMessage(memory);
  });
  if (previousBuffer.byteLength !== payload.pointer || payload.after !== payload.pointer + 65536) throw new Error("Worker did not grow the supplied shared memory by one page");
  // Read the published view without calling any Emscripten helper. The direct
  // exported entry below must refresh its own production bridge views.
  const staleView = previousHeap ? previousHeap.byteLength : previousBuffer.byteLength;
  if (staleView !== payload.pointer) throw new Error("The old heap view unexpectedly changed before the bridge probe");
  message(`[webgl-ffi] WORKER_GROWTH ${payload.pointer}->${payload.after} stale_view=${staleView}`);
  const result = module._puerts_webgl_ffi_memory_growth(payload.pointer, payload.length);
  if (result !== 0 || !window.ffiResult.messages.includes("[webgl-ffi] MEMORY_GROWTH PASS")) throw new Error("Shared memory growth regression failed");
  worker.terminate();
  URL.revokeObjectURL(workerUrl);
  window.ffiResult.status = "passed";
  window.ffiResult.crossOriginIsolated = crossOriginIsolated;
  window.ffiResult.oldMemoryBytes = payload.pointer;
  window.ffiResult.newMemoryBytes = payload.after;
})().catch(error => {
  window.ffiResult.status = "failed";
  window.ffiResult.error = String(error && error.stack || error);
  console.error(error);
});
</script>
